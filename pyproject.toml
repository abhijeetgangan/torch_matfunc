[project]
name = "torch_matfunc"
version = "0.1.0"
description = "Triton / pure-Torch matrix exponential for PyTorch"
authors = [
    { name = "Abhijeet Gangan", email = "flyingicecube42@gmail.com" },
    { name = "Abhijeet Gangan", email = "abhijeetgangan@g.ucla.edu" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["tests", "."]

[project.optional-dependencies]
triton = [
    "triton>=3.6",
]
dev = [
    "pre-commit",
    "ruff",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["torch_matfunc*"]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "deprecated",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
fixable = ["ALL"]
ignore = ["E741"]  # allow I for identity matrices in linalg code

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # __init__ imports are re-exports

[tool.ruff.lint.isort]
known-first-party = ["torch_matfunc"]
